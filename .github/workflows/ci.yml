name: Aiko CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Default-deny: jobs get read-only access unless they opt in (see `release`).
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of queueing duplicates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements.txt
    # PyAudio is sdist-only and needs PortAudio headers; OpenCV needs libGL.
    # Without these the `pip install -r requirements.txt` step fails on ubuntu.
    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev libgl1 libglib2.0-0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
        pip install "ruff==0.15.21"
    # Gating lint: only the fatal class (syntax errors, undefined names, invalid
    # __future__ imports, broken comparisons). The full rule set is reported below
    # but is NOT gating until the backlog is burned down.
    - name: Lint (fatal errors — gating)
      run: ruff check core/ tests/ --select E9,F63,F7,F82 --output-format=github
    - name: Lint (full rule set — reported, not gating)
      run: ruff check core/ tests/ --output-format=github || true
    - name: Format check (reported, not gating)
      run: ruff format --check core/ tests/ || true
    - name: Run tests
      # Coverage floor is the measured baseline, not an aspiration.
      # Measured 27.5% on 2026-10-24 (commit 487c128). Ratchet as coverage grows.
      run: pytest tests/ -v --cov=core --cov-report=xml --cov-report=term-missing --cov-fail-under=25
      env:
        AIKO_SECRET_KEY: test-secret
        MASTER_ID: "123456789"
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiko-app
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: aiko-app/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npx tsc --noEmit
    - name: Run tests
      run: npm test
    - name: Build
      run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    # Previously `PyCQA/bandit@main` — an unpinned action ref is a supply-chain
    # risk, and writing JSON to a file hid every finding from the log.
    - name: Install Bandit
      run: python -m pip install bandit
    - name: Run Bandit (high severity — gating)
      # -lll restricts to HIGH severity; no --exit-zero, so findings fail the job.
      run: bandit -r core/ -lll -f json -o bandit-report.json
    - name: Upload Bandit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  release:
    needs: [test-python, test-frontend, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: aiko-app/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Python Sidecar
      run: python build_sidecar.py

    - name: Install Frontend dependencies
      working-directory: aiko-app
      run: npm ci

    - name: Build Tauri App
      working-directory: aiko-app
      run: npm run tauri build

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          aiko-app/src-tauri/target/release/bundle/msi/*.msi
          aiko-app/src-tauri/target/release/bundle/nsis/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
